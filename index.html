<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 12 — Работы</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    user-select: none;
  }

  body {
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  /* ===== LOCK SCREEN ===== */
  .lock-screen {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.5s, transform 0.5s;
  }

  .lock-screen.hidden {
    opacity: 0;
    transform: translateY(-100%);
    pointer-events: none;
  }

  .lock-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 30%, #0f3460 60%, #533483 100%);
    z-index: 0;
  }

  .lock-bg::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(83, 52, 131, 0.4), transparent);
    top: -100px;
    right: -100px;
  }

  .lock-bg::after {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(15, 52, 96, 0.5), transparent);
    bottom: -100px;
    left: -100px;
  }

  .lock-content {
    position: relative;
    z-index: 1;
    text-align: center;
    color: white;
  }

  .lock-time {
    font-size: 80px;
    font-weight: 200;
    letter-spacing: -2px;
    margin-bottom: 4px;
  }

  .lock-date {
    font-size: 18px;
    font-weight: 300;
    opacity: 0.8;
    margin-bottom: 60px;
  }

  .lock-hint {
    font-size: 14px;
    opacity: 0.5;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  /* ===== DESKTOP ===== */
  .desktop {
    width: 100vw;
    height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    background-size: cover;
    position: relative;
    overflow: hidden;
  }

  .desktop-wallpaper {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 40%, #4a00e0 0%, transparent 50%),
      radial-gradient(ellipse at 70% 60%, #8e2de2 0%, transparent 50%),
      radial-gradient(ellipse at 50% 30%, #00d2ff 0%, transparent 40%),
      linear-gradient(180deg, #0f0c29, #302b63, #24243e);
  }

  .desktop-icons {
    position: absolute;
    top: 20px;
    left: 20px;
    display: grid;
    grid-template-columns: repeat(2, 80px);
    gap: 6px;
    z-index: 2;
  }

  .desktop-icon {
    width: 80px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .desktop-icon:hover { background: rgba(255, 255, 255, 0.1); }
  .desktop-icon:active { background: rgba(255, 255, 255, 0.15); }

  .desktop-icon .di-icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }

  .desktop-icon .di-name {
    font-size: 11px;
    color: white;
    text-align: center;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.7);
    line-height: 1.2;
  }

  /* ===== FLOATING TASKBAR ===== */
  .taskbar {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    background: rgba(30, 30, 30, 0.75);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.4),
      0 2px 8px rgba(0, 0, 0, 0.2),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    z-index: 100;
    transition: background 0.3s;
  }

  .taskbar:hover { background: rgba(35, 35, 35, 0.85); }

  .taskbar-center { display: flex; align-items: center; gap: 4px; }

  .taskbar-btn {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    font-size: 20px;
    color: white;
  }

  .taskbar-btn:hover { background: rgba(255, 255, 255, 0.1); }
  .taskbar-btn:active { background: rgba(255, 255, 255, 0.15); transform: scale(0.95); }

  .taskbar-btn.active::after {
    content: '';
    position: absolute;
    bottom: 2px;
    width: 16px;
    height: 3px;
    background: #60cdff;
    border-radius: 2px;
  }

  .taskbar-btn.start-btn { font-size: 22px; }

  .taskbar-divider {
    width: 1px;
    height: 24px;
    background: rgba(255, 255, 255, 0.1);
    margin: 0 4px;
  }

  .taskbar-tray {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .taskbar-tray:hover { background: rgba(255, 255, 255, 0.1); }
  .taskbar-tray .tray-icon { font-size: 14px; color: white; }

  .taskbar-time { color: white; font-size: 12px; line-height: 1.2; text-align: right; }
  .tray-date { opacity: 0.8; font-size: 11px; }

  /* ===== START MENU ===== */
  .start-menu {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 560px;
    background: rgba(32, 32, 32, 0.85);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 16px 64px rgba(0, 0, 0, 0.5);
    z-index: 200;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }

  .start-menu.visible { display: flex; }

  .start-top { padding: 20px 24px 16px; }

  .start-search { position: relative; width: 100%; }

  .start-search input {
    width: 100%;
    padding: 10px 16px 10px 40px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: white;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
  }

  .start-search input::placeholder { color: rgba(255, 255, 255, 0.4); }
  .start-search input:focus { background: rgba(255, 255, 255, 0.12); border-color: rgba(96, 205, 255, 0.4); }

  .start-search .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: rgba(255, 255, 255, 0.4);
  }

  .start-apps {
    flex: 1;
    padding: 8px 24px 24px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
    overflow-y: auto;
    align-content: flex-start;
  }

  .start-app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 4px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .start-app:hover { background: rgba(255, 255, 255, 0.1); }
  .start-app .app-icon { font-size: 28px; }
  .start-app .app-name { font-size: 11px; color: rgba(255, 255, 255, 0.8); text-align: center; }

  .start-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 24px 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .start-user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .start-user:hover { background: rgba(255, 255, 255, 0.1); }

  .user-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: white;
  }

  .user-name { font-size: 13px; color: white; }

  .start-power {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    color: white;
    transition: background 0.2s;
  }

  .start-power:hover { background: rgba(255, 255, 255, 0.1); }

  /* ===== WINDOWS ===== */
  .window {
    position: absolute;
    background: rgba(32, 32, 32, 0.9);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
    z-index: 50;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-width: 340px;
    min-height: 220px;
    max-width: calc(100vw - 24px);
    max-height: calc(100vh - 90px);
  }

  .window.focused {
    border-color: rgba(96, 205, 255, 0.3);
    box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(96, 205, 255, 0.15);
  }

  .window.maximized { border-radius: 0; }

  .window-header {
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 0 10px;
    background: rgba(0, 0, 0, 0.15);
    cursor: move;
    flex-shrink: 0;
  }

  .window-title {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.8);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .window-title-icon { font-size: 14px; }

  .window-controls { display: flex; gap: 0; }

  .window-ctrl-btn {
    width: 46px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
  }

  .window-ctrl-btn:hover { background: rgba(255, 255, 255, 0.1); }
  .window-ctrl-btn.close:hover { background: #c42b1c; color: white; }

  .window-body { flex: 1; padding: 0; overflow: auto; min-height: 0; }

  /* File Explorer Content */
  .file-explorer { display: flex; height: 100%; }

  .fe-sidebar {
    width: 190px;
    flex-shrink: 0;
    background: rgba(0, 0, 0, 0.2);
    padding: 10px 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
  }

  .fe-sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
    transition: background 0.15s;
  }

  .fe-sidebar-item:hover { background: rgba(255, 255, 255, 0.08); }
  .fe-sidebar-item.active { background: rgba(255, 255, 255, 0.1); color: white; }
  .fe-sidebar-item .fe-icon { font-size: 16px; flex-shrink: 0; }
  .fe-sidebar-item .fe-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .fe-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .fe-topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(0, 0, 0, 0.15);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    flex-shrink: 0;
  }

  .fe-nav { display: flex; gap: 4px; }

  .fe-navbtn {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: rgba(255, 255, 255, 0.7);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }

  .fe-navbtn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }
  .fe-navbtn:disabled { opacity: 0.3; cursor: default; }

  .fe-breadcrumb {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.65);
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }

  .fe-crumb { cursor: pointer; padding: 2px 6px; border-radius: 5px; }
  .fe-crumb:hover { background: rgba(255, 255, 255, 0.1); color: white; }

  .fe-hint { font-size: 11px; color: rgba(255, 255, 255, 0.4); padding: 8px 12px 0; }

  .fe-main {
    flex: 1;
    padding: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-content: flex-start;
    overflow-y: auto;
  }

  .fe-item {
    width: 96px;
    padding: 10px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .fe-item:hover { background: rgba(255, 255, 255, 0.08); }
  .fe-item .fe-item-icon { font-size: 34px; }

  .fe-item .fe-item-name {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.8);
    text-align: center;
    line-height: 1.3;
    word-break: break-word;
  }

  .fe-empty { color: rgba(255, 255, 255, 0.4); font-size: 13px; padding: 20px; }

  /* Work viewer (iframe) */
  .work-view { display: flex; flex-direction: column; height: 100%; background: #fff; }

  .work-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 10px;
    background: rgba(20, 20, 20, 0.92);
    flex-shrink: 0;
  }

  .work-path {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.6);
    font-family: Consolas, monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .work-open { font-size: 11px; color: #60cdff; text-decoration: none; white-space: nowrap; }
  .work-open:hover { text-decoration: underline; }
  .work-frame { flex: 1; width: 100%; border: none; background: #fff; }

  body.dragging iframe { pointer-events: none; }
  body.dragging { cursor: move; }

  /* Browser Content */
  .browser { display: flex; flex-direction: column; height: 100%; }

  .browser-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(0, 0, 0, 0.2);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .browser-nav-btn {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
    transition: background 0.15s;
  }

  .browser-nav-btn:hover { background: rgba(255, 255, 255, 0.1); }

  .browser-url {
    flex: 1;
    padding: 6px 12px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 13px;
    outline: none;
  }

  .browser-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.15);
  }

  .browser-home { text-align: center; color: rgba(255, 255, 255, 0.5); }
  .browser-home .browser-logo { font-size: 48px; margin-bottom: 16px; }

  /* Settings Content */
  .settings { display: flex; height: 100%; }

  .settings-nav {
    width: 200px;
    flex-shrink: 0;
    padding: 12px 8px;
    background: rgba(0, 0, 0, 0.2);
    overflow-y: auto;
  }

  .settings-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.7);
    transition: background 0.15s;
  }

  .settings-nav-item:hover { background: rgba(255, 255, 255, 0.08); }
  .settings-nav-item.active { background: rgba(255, 255, 255, 0.1); color: white; }
  .settings-nav-item .sni-icon { font-size: 18px; }

  .settings-content { flex: 1; padding: 24px; overflow-y: auto; }
  .settings-title { font-size: 28px; font-weight: 600; color: white; margin-bottom: 24px; }

  .settings-card {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
  .settings-row + .settings-row { border-top: 1px solid rgba(255, 255, 255, 0.05); }
  .settings-label { font-size: 13px; color: rgba(255, 255, 255, 0.8); }
  .settings-sublabel { font-size: 11px; color: rgba(255, 255, 255, 0.4); margin-top: 2px; }

  .toggle {
    width: 44px;
    height: 22px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 11px;
    cursor: pointer;
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .toggle.on { background: #60cdff; }

  .toggle::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    background: white;
    border-radius: 50%;
    top: 3px;
    left: 3px;
    transition: transform 0.2s;
  }

  .toggle.on::after { transform: translateX(22px); }

  /* Generic placeholder content */
  .app-placeholder {
    padding: 40px;
    text-align: center;
    color: rgba(255, 255, 255, 0.5);
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .app-placeholder .ph-icon { font-size: 56px; }

  /* ===== CONTEXT MENU ===== */
  .context-menu {
    position: fixed;
    background: rgba(44, 44, 44, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    padding: 6px;
    z-index: 1000;
    display: none;
    min-width: 210px;
    animation: ctxIn 0.1s ease-out;
  }

  .context-menu.visible { display: block; }

  @keyframes ctxIn {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .ctx-item {
    padding: 8px 14px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.85);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.1s;
  }

  .ctx-item:hover { background: rgba(255, 255, 255, 0.1); }
  .ctx-sep { height: 1px; background: rgba(255, 255, 255, 0.08); margin: 4px 8px; }

  /* ===== WIDGET PANEL ===== */
  .widget-panel {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 320px;
    display: none;
    flex-direction: column;
    gap: 10px;
    z-index: 80;
    animation: widgetIn 0.2s ease-out;
  }

  .widget-panel.visible { display: flex; }

  @keyframes widgetIn {
    from { transform: translateX(20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .widget-card {
    background: rgba(32, 32, 32, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 16px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

  .widget-card-title { font-size: 13px; color: rgba(255, 255, 255, 0.6); margin-bottom: 8px; }
  .widget-card-value { font-size: 28px; font-weight: 600; color: white; }
  .widget-card-sub { font-size: 12px; color: rgba(255, 255, 255, 0.4); margin-top: 4px; }

  .quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }

  .quick-action-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .quick-action-btn:hover { background: rgba(255, 255, 255, 0.12); }
  .quick-action-btn .qa-icon { font-size: 20px; }
  .quick-action-btn .qa-label { font-size: 11px; color: rgba(255, 255, 255, 0.7); }
  .quick-action-btn.active { background: #60cdff; }
  .quick-action-btn.active .qa-label { color: white; }

  /* ===== LOADING SCREEN ===== */
  .loading-screen {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 12000;
    transition: opacity 0.5s ease-out;
  }

  .loading-screen.hidden { opacity: 0; pointer-events: none; }
  .loading-logo { font-size: 48px; margin-bottom: 32px; }

  .loading-spinner {
    width: 40px;
    height: 40px;

    function updateClock() {
      const now = new Date();
      const t = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      const d = now.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
      set('lock-time', t); set('lock-date', d);
      set('tray-time', t); set('tray-date', d);
      set('widget-time', t); set('widget-date', d);
    }

    // ===== Меню Пуск =====

    function closeStartMenu() { getStartMenu().classList.remove('visible'); }

    function renderStartApps(filter = '') {
      const q = filter.trim().toLowerCase();
      const list = q ? APPS.filter(a => a.name.toLowerCase().includes(q)) : APPS;
      const container = document.getElementById('start-apps');
      container.innerHTML = list.map(app => `
        <div class="start-app" data-appid="${app.id}">
          <span class="app-icon">${app.icon}</span>
          <span class="app-name">${app.name}</span>

      container.querySelectorAll('.start-app').forEach(item => {
        item.onclick = () => openApp(APPS.find(a => a.id === item.dataset.appid));
      });
    }

    // ===== Рабочий стол =====
    function renderDesktopIcons() {
      const wrap = document.getElementById('desktop-icons');
      wrap.innerHTML = '';
      APPS.filter(a => DESKTOP_APPS.includes(a.id)).forEach(app => {
        const icon = document.createElement('div');
        icon.className = 'desktop-icon';
        icon.innerHTML = `<div class="di-icon">${app.icon}</div><div class="di-name">${app.name}</div>`;
        icon.ondblclick = () => openApp(app);
        wrap.appendChild(icon);
      });
    }

    // ===== Окна =====
    function createWindow({ title, icon = '🪟', bodyHTML, width = 820, height = 560, appId = null }) {
      winSeq++;
      const id = winSeq;
      const el = document.createElement('div');
      el.className = 'window';
      el.id = 'win-' + id;
      el.style.width = width + 'px';
      el.style.height = height + 'px';
      const offset = (windows.length % 6) * 26;
      el.style.left = Math.max(20, Math.round((window.innerWidth - width) / 2) + offset) + 'px';
      el.style.top = Math.max(20, Math.round((window.innerHeight - height) / 2) - 40 + offset) + 'px';
      el.innerHTML = `
        <div class="window-header">
          <div class="window-title"><span class="window-title-icon">${icon}</span><span>${title}</span></div>
          <div class="window-controls">
            <div class="window-ctrl-btn" data-act="min" title="Свернуть">—</div>
            <div class="window-ctrl-btn" data-act="max" title="Развернуть">▢</div>
            <div class="window-ctrl-btn close" data-act="close" title="Закрыть">✕</div>
          </div>
        </div>
        <div class="window-body">${bodyHTML}</div>`;
      getWindowsContainer().appendChild(el);

      const win = { id, element: el, appId, title, icon, minimized: false, maximized: false, prevRect: null, taskbarBtn: null };
      windows.push(win);

      el.querySelector('[data-act="min"]').onclick = e => { e.stopPropagation(); minimizeWindow(id); };
      el.querySelector('[data-act="max"]').onclick = e => { e.stopPropagation(); toggleMaximize(id); };
      el.querySelector('[data-act="close"]').onclick = e => { e.stopPropagation(); closeWindow(id); };
      el.addEventListener('mousedown', () => focusWindow(id));

      addTaskbarButton(win);
      focusWindow(id);
      return win;
    }

    function focusWindow(id) {
      const win = windows.find(w => w.id === id);
      if (!win) return;
      zTop++;
      win.element.style.zIndex = zTop;
      windows.forEach(w => w.element.classList.toggle('focused', w.id === id));
      if (win.minimized) { win.minimized = false; win.element.style.display = 'flex'; }
      activeWindowId = id;
      windows.forEach(w => w.taskbarBtn && w.taskbarBtn.classList.toggle('active', w.id === id));
    }

    function minimizeWindow(id) {
      const win = windows.find(w => w.id === id);
      if (!win) return;
      win.minimized = true;
      win.element.style.display = 'none';
      win.element.classList.remove('focused');
      win.taskbarBtn && win.taskbarBtn.classList.remove('active');
    }

    function toggleMaximize(id) {
      const win = windows.find(w => w.id === id);
      if (!win) return;
      const el = win.element;
      if (!win.maximized) {
        win.prevRect = { left: el.style.left, top: el.style.top, width: el.style.width, height: el.style.height };
        el.style.left = '0'; el.style.top = '0';
        el.style.width = '100vw'; el.style.height = 'calc(100vh - 80px)';
        el.classList.add('maximized');
        win.maximized = true;
      } else {
        Object.assign(el.style, win.prevRect);
        el.classList.remove('maximized');
        win.maximized = false;
      }
      focusWindow(id);
    }

    function closeWindow(id) {
      const i = windows.findIndex(w => w.id === id);
      if (i === -1) return;
      windows[i].element.remove();
      windows[i].taskbarBtn && windows[i].taskbarBtn.remove();
      windows.splice(i, 1);
    }

    // ===== Кнопки запущенных окон на панели задач =====
    function addTaskbarButton(win) {
      const center = document.getElementById('taskbar-center');
      const btn = document.createElement('div');
      btn.className = 'taskbar-btn';
      btn.innerHTML = win.icon;
      btn.title = win.title;
      btn.onclick = e => {
        e.stopPropagation();
        if (win.minimized || activeWindowId !== win.id) focusWindow(win.id);
        else minimizeWindow(win.id);
      };
      center.appendChild(btn);
      win.taskbarBtn = btn;
    }

    // ===== Запуск приложений =====

      if (!app) return;
      closeStartMenu();
      const existing = windows.find(w => w.appId === app.id);

      const size = app.id === 'explorer' ? { width: 860, height: 560 } : { width: 760, height: 520 };

    // ===== Проводник: навигация по дереву работ =====

      let history = [];  // история для кнопки «Назад»

      function nodeAt(path) {
        let node = { name: 'Этот компьютер', children: FS };
        for (const idx of path) node = node.children[idx];
        return node;
      }
      function childrenAt(path) {
        return path.length === 0 ? FS : (nodeAt(path).children || []);
      }

      function render() {
        const items = childrenAt(loc);

        // хлебные крошки
        let html = `<span class="fe-crumb" data-depth="0">💻 Этот компьютер</span>`;
        const acc = [];
        loc.forEach((idx, i) => {
          acc.push(idx);
          html += `<span>›</span><span class="fe-crumb" data-depth="${i + 1}">${escapeHtml(nodeAt(acc.slice()).name)}</span>`;
        });
        crumb.innerHTML = html;

        // элементы текущей папки
        main.innerHTML = items.map((node, idx) => {
          const icon = node.icon || (node.children ? '📁' : '🌐');
          return `<div class="fe-item" data-idx="${idx}"><span class="fe-item-icon">${icon}</span><div class="fe-item-name">${escapeHtml(node.name)}</div></div>`;
        }).join('') || `<div class="fe-empty">Папка пуста</div>`;

        main.querySelectorAll('.fe-item').forEach(el => {
          el.onclick = () => {
            const idx = Number(el.dataset.idx);
            const node = items[idx];
            if (node.children) { history.push(loc.slice()); loc.push(idx); render(); }
            else if (node.path) { openFrame(node.path, node.name); }
          };
        });
        crumb.querySelectorAll('.fe-crumb').forEach(el => {
          el.onclick = () => { history.push(loc.slice()); loc = loc.slice(0, Number(el.dataset.depth)); render(); };
        });

        upBtn.disabled = loc.length === 0;
        backBtn.disabled = history.length === 0;

        root.querySelectorAll('.fe-sidebar-item').forEach(it => {
          const nav = it.dataset.nav;
          const active = (nav === 'root' && loc.length === 0) || (loc.length >= 1 && String(loc[0]) === nav);
          it.classList.toggle('active', active);
        });
      }

      backBtn.onclick = () => { if (history.length) { loc = history.pop(); render(); } };
      upBtn.onclick = () => { if (loc.length) { history.push(loc.slice()); loc = loc.slice(0, -1); render(); } };

      root.querySelectorAll('.fe-sidebar-item').forEach(it => {
        it.onclick = () => {
          history.push(loc.slice());
          loc = it.dataset.nav === 'root' ? [] : [Number(it.dataset.nav)];
          render();
        };
      });

      render();
    }

    // ===== Экранирование для вставки в HTML =====
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ===== Открыть файл-работу в окне (iframe) =====
    function openFrame(path, title) {
      const url = encodeURI(path); // кодируем пробелы («4-th pool») и кириллицу
      createWindow({
        title: title,
        icon: '🌐',
        width: 980,
        height: 660,
        bodyHTML: `
          <div class="work-view">
            <div class="work-toolbar">
              <span class="work-path">${escapeHtml(path)}</span>
              <a class="work-open" href="${url}" target="_blank" rel="noopener">Открыть в новой вкладке ↗</a>
            </div>
            <iframe class="work-frame" src="${url}" title="${escapeHtml(title)}"></iframe>
          </div>`
      });
    }

    // ===== Перетаскивание окон =====
    function initDragging() {
      getWindowsContainer().addEventListener('mousedown', e => {
        const header = e.target.closest('.window-header');
        if (!header) return;
        if (e.target.closest('.window-controls')) return;
        const winEl = header.closest('.window');
        const win = windows.find(w => w.element === winEl);
        if (!win || win.maximized) return;
        focusWindow(win.id);
        dragData = { el: winEl, sx: e.clientX, sy: e.clientY, sl: winEl.offsetLeft, st: winEl.offsetTop };
        document.body.classList.add('dragging');
        e.preventDefault();
      });

      document.addEventListener('mousemove', e => {
        if (!dragData) return;
        let left = dragData.sl + (e.clientX - dragData.sx);
        let top = dragData.st + (e.clientY - dragData.sy);
        left = Math.min(window.innerWidth - 80, Math.max(-(dragData.el.offsetWidth - 120), left));
        top = Math.min(window.innerHeight - 90, Math.max(0, top));
        dragData.el.style.left = left + 'px';
        dragData.el.style.top = top + 'px';
      });

      document.addEventListener('mouseup', () => {
        dragData = null;
        document.body.classList.remove('dragging');
      });
    }

    // ===== Контекстное меню =====
    function wireContextMenu() {
      document.addEventListener('contextmenu', e => {
        if (e.target.closest('.window')) return; // обычное меню внутри окон/работ
        e.preventDefault();
        const menu = getContextMenu();
        menu.innerHTML = `
          <div class="ctx-item" data-act="explorer">📁 Открыть проводник</div>
          <div class="ctx-item" data-act="refresh">🔄 Обновить</div>
          <div class="ctx-sep"></div>
          <div class="ctx-item" data-act="settings">⚙️ Параметры</div>
          <div class="ctx-item" data-act="lock">🔒 Заблокировать</div>`;
        const mw = 220, mh = 160;
        menu.style.left = Math.min(e.pageX, window.innerWidth - mw) + 'px';
        menu.style.top = Math.min(e.pageY, window.innerHeight - mh) + 'px';
        menu.classList.add('visible');
        menu.querySelectorAll('.ctx-item').forEach(item => {
          item.onclick = () => {
            const act = item.dataset.act;
            menu.classList.remove('visible');
            if (act === 'explorer') openApp(APPS.find(a => a.id === 'explorer'));
            else if (act === 'refresh') location.reload();
            else if (act === 'settings') openApp(APPS.find(a => a.id === 'settings'));
            else if (act === 'lock') document.getElementById('lock-screen').classList.remove('hidden');
          };
        });
      });
      document.addEventListener('click', () => getContextMenu().classList.remove('visible'));
    }

    // ===== Глобальные обработчики закрытия =====
    function wireGlobalClose() {
      document.addEventListener('click', e => {
        const sm = getStartMenu();
        if (sm.classList.contains('visible') && !sm.contains(e.target) && !e.target.closest('#start-btn')) {
          closeStartMenu();
        }
      });
    }

    // ===== Инициализация =====
    function init() {
      setTimeout(() => document.getElementById('loading').classList.add('hidden'), 1500);

      updateClock();
      setInterval(updateClock, 1000);

      const lock = document.getElementById('lock-screen');
      lock.addEventListener('click', () => {
        lock.classList.add('hidden');
        if (!lock.dataset.opened) {
          lock.dataset.opened = '1';
          setTimeout(() => openApp(APPS.find(a => a.id === 'explorer')), 350);
        }
      });

      renderDesktopIcons();

      // Кнопка Пуск
      const startBtn = document.createElement('div');
      startBtn.className = 'taskbar-btn start-btn';
      startBtn.id = 'start-btn';
      startBtn.innerHTML = '⊞';
      startBtn.title = 'Пуск';
      startBtn.onclick = e => { e.stopPropagation(); toggleStartMenu(); };
      document.getElementById('taskbar-center').appendChild(startBtn);

      renderStartApps();
      document.getElementById('start-search-input').oninput = e => renderStartApps(e.target.value);

      document.getElementById('taskbar-tray').addEventListener('click', () => {
        document.getElementById('widget-panel').classList.toggle('visible');
      });

      document.getElementById('power-btn').onclick = () => {
        closeStartMenu();
        document.getElementById('lock-screen').classList.remove('hidden');
      };

      // Быстрые действия в виджетах
      document.addEventListener('click', e => {
        const b = e.target.closest('.quick-action-btn');
        if (b) b.classList.toggle('active');
      });

      wireContextMenu();
      wireGlobalClose();
      initDragging();
    }

    init();
  </script>
</body>
</html>
