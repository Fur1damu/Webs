<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проводник — Работы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

  html, body { height: 100%; }

  body {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(-45deg, #1e3a8a, #6d28d9, #2563eb, #0ea5e9, #7c3aed);
    background-size: 320% 320%;
    animation: bgShift 22s ease infinite;
  }

  @keyframes bgShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* мягкие световые пятна поверх градиента */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(40% 50% at 15% 15%, rgba(255, 255, 255, .18), transparent 60%),
      radial-gradient(40% 45% at 85% 80%, rgba(236, 72, 153, .22), transparent 60%);
  }

  /* ===== ОКНО ПРОВОДНИКА ===== */
  .explorer {
    position: relative;
    z-index: 1;
    width: min(940px, 95vw);
    height: min(660px, 88vh);
    background: rgba(24, 24, 30, 0.72);
    backdrop-filter: blur(40px) saturate(160%);
    -webkit-backdrop-filter: blur(40px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .explorer__titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    background: rgba(0, 0, 0, 0.2);
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    color: rgba(255, 255, 255, 0.85);
    font-size: 13px;
    font-weight: 600;
  }
  .explorer__dots { display: flex; gap: 7px; }
  .explorer__dots span { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .dot-r { background: #ff5f57; } .dot-y { background: #febc2e; } .dot-g { background: #28c840; }

  .file-explorer { flex: 1; display: flex; min-height: 0; }

  .fe-sidebar {
    width: 210px;
    flex-shrink: 0;
    background: rgba(0, 0, 0, 0.18);
    padding: 10px 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
  }
  .fe-sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
    transition: background .15s;
  }
  .fe-sidebar-item:hover { background: rgba(255, 255, 255, 0.08); }
  .fe-sidebar-item.active { background: rgba(255, 255, 255, 0.13); color: #fff; }
  .fe-sidebar-item .fe-icon { font-size: 16px; flex-shrink: 0; }
  .fe-sidebar-item .fe-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .fe-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .fe-topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: rgba(0, 0, 0, 0.12);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    flex-shrink: 0;
  }
  .fe-nav { display: flex; gap: 4px; }
  .fe-navbtn {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border: none;
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.75);
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
  }
  .fe-navbtn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.15); }
  .fe-navbtn:disabled { opacity: .3; cursor: default; }

  .fe-breadcrumb { font-size: 12px; color: rgba(255, 255, 255, 0.65); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .fe-crumb { cursor: pointer; padding: 2px 6px; border-radius: 5px; }
  .fe-crumb:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

  .fe-hint { font-size: 11px; color: rgba(255, 255, 255, 0.4); padding: 8px 16px 0; }

  .fe-main {
    flex: 1;
    padding: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-content: flex-start;
    overflow-y: auto;
  }
  .fe-item {
    width: 108px;
    padding: 12px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s, transform .15s;
  }
  .fe-item:hover { background: rgba(255, 255, 255, 0.09); transform: translateY(-2px); }
  .fe-item-icon { font-size: 40px; line-height: 1; }
  .fe-item-name { font-size: 11px; color: rgba(255, 255, 255, 0.82); text-align: center; line-height: 1.3; word-break: break-word; }
  .fe-empty { color: rgba(255, 255, 255, 0.4); font-size: 13px; padding: 20px; }

  /* ===== ПРОСМОТРЩИК РАБОТЫ ===== */
  .viewer {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    flex-direction: column;
    background: #fff;
  }
  .viewer.is-open { display: flex; }

  .viewer__bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: #0f172a;
    color: #fff;
    flex-shrink: 0;
  }
  .viewer__back {
    border: none;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .viewer__back:hover { background: rgba(255, 255, 255, 0.22); }
  .viewer__path { flex: 1; font-family: "Consolas", monospace; font-size: 12px; color: rgba(255, 255, 255, 0.6); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer__open { font-size: 12px; color: #60cdff; text-decoration: none; white-space: nowrap; }
  .viewer__open:hover { text-decoration: underline; }
  .viewer__frame { flex: 1; width: 100%; border: none; background: #fff; }

  /* ===== Скроллбар ===== */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

  @media (max-width: 600px) {
    .fe-sidebar { width: 150px; }
    .fe-item { width: calc(33.333% - 8px); }
  }
</style>
</head>
<body>
  <div class="explorer">
    <div class="explorer__titlebar">
      <span class="explorer__dots"><span class="dot-r"></span><span class="dot-y"></span><span class="dot-g"></span></span>
      Проводник — Работы
    </div>
    <div class="file-explorer">
      <div class="fe-sidebar"></div>
      <div class="fe-pane">
        <div class="fe-topbar">
          <div class="fe-nav">
            <button class="fe-navbtn fe-back" title="Назад">←</button>
            <button class="fe-navbtn fe-up" title="Вверх">↑</button>
          </div>
          <div class="fe-breadcrumb"></div>
        </div>
        <div class="fe-hint">Открывайте папки и нажимайте на работу — она откроется здесь же. Все задания: 4-th и 3-rd pool, 1–10 и карты.</div>
        <div class="fe-main"></div>
      </div>
    </div>
  </div>

  <div class="viewer" id="viewer">
    <div class="viewer__bar">
      <button class="viewer__back" id="viewer-back">← Назад к проводнику</button>
      <span class="viewer__path" id="viewer-path"></span>
      <a class="viewer__open" id="viewer-open" target="_blank" rel="noopener">Открыть в новой вкладке ↗</a>
    </div>
    <iframe class="viewer__frame" id="viewer-frame" title="Работа"></iframe>
  </div>

  <script>
    // ===== Файловая система: все работы (папки -> файлы) =====
    const FS = [
      { name: '4-th pool — JavaScript', icon: '📁', children: [
        { name: 'Блок 1. Основы', icon: '📄', path: '4-th pool/01-osnovy/index.html' },
        { name: 'Блок 2. Функции и циклы', icon: '📄', path: '4-th pool/02-funkcii-i-cikly/index.html' },
        { name: 'Блок 3. Массивы', icon: '📄', path: '4-th pool/03-massivy/index.html' },
        { name: 'Блок 4. Объекты', icon: '📄', path: '4-th pool/04-obyekty/index.html' },
        { name: 'Блок 5. Работа с данными', icon: '📄', path: '4-th pool/05-rabota-s-dannymi/index.html' },
        { name: 'Блок 6. DOM', icon: '📄', path: '4-th pool/06-dom/index.html' },
        { name: 'Блок 7. События', icon: '📄', path: '4-th pool/07-sobytiya/index.html' },
      ]},
      { name: '3-rd pool — HTML/CSS', icon: '📁', children: [
        { name: 'Задание 1', icon: '📁', children: [
          { name: 'index.html', path: '3-rd pool/1/index.html' },
        ]},
        { name: 'Задание 2', icon: '📁', children: [
          { name: 'resume.html', path: '3-rd pool/2/resume.html' },
        ]},
        { name: 'Задание 3', icon: '📁', children: [
          { name: 'news.html', path: '3-rd pool/3/news.html' },
          { name: 'personal-site.html', path: '3-rd pool/3/personal-site.html' },
          { name: 'resume-yaromir.html', path: '3-rd pool/3/resume-yaromir.html' },
        ]},
        { name: 'Задание 4', icon: '📁', children: [
          { name: 'feedback.html', path: '3-rd pool/4/feedback.html' },
          { name: 'filter.html', path: '3-rd pool/4/filter.html' },
          { name: 'register.html', path: '3-rd pool/4/register.html' },
          { name: 'survey.html', path: '3-rd pool/4/survey.html' },
        ]},
        { name: 'Задание 5', icon: '📁', children: [
          { name: 'box-model.html', path: '3-rd pool/5/box-model.html' },
          { name: 'cards.html', path: '3-rd pool/5/cards.html' },
          { name: 'resume-styled.html', path: '3-rd pool/5/resume-styled.html' },
        ]},
        { name: 'Задание 6', icon: '📁', children: [
          { name: 'box-sizing.html', path: '3-rd pool/6/box-sizing.html' },
          { name: 'cards-8.html', path: '3-rd pool/6/cards-8.html' },
          { name: 'catalog.html', path: '3-rd pool/6/catalog.html' },
          { name: 'display.html', path: '3-rd pool/6/display.html' },
          { name: 'overflow.html', path: '3-rd pool/6/overflow.html' },
        ]},
        { name: 'Задание 7 — Flexbox', icon: '📁', children: [
          { name: 'flex7-1-header.html', path: '3-rd pool/7/flex7-1-header.html' },
          { name: 'flex7-2-center.html', path: '3-rd pool/7/flex7-2-center.html' },
          { name: 'flex7-3-cards.html', path: '3-rd pool/7/flex7-3-cards.html' },
          { name: 'flex7-4-team.html', path: '3-rd pool/7/flex7-4-team.html' },
          { name: 'flex7-5-toolbar.html', path: '3-rd pool/7/flex7-5-toolbar.html' },
        ]},
        { name: 'Задание 8 — Flexbox', icon: '📁', children: [
          { name: 'flex8-1-header.html', path: '3-rd pool/8/flex8-1-header.html' },
          { name: 'flex8-2-toolbar.html', path: '3-rd pool/8/flex8-2-toolbar.html' },
          { name: 'flex8-3-product.html', path: '3-rd pool/8/flex8-3-product.html' },
          { name: 'flex8-4-cabinet.html', path: '3-rd pool/8/flex8-4-cabinet.html' },
          { name: 'flex8-5-rows.html', path: '3-rd pool/8/flex8-5-rows.html' },
        ]},
        { name: 'Задание 9 — Grid', icon: '📁', children: [
          { name: 'grid9-1-catalog.html', path: '3-rd pool/9/grid9-1-catalog.html' },
          { name: 'grid9-2-gallery.html', path: '3-rd pool/9/grid9-2-gallery.html' },
          { name: 'grid9-3-homepage.html', path: '3-rd pool/9/grid9-3-homepage.html' },
          { name: 'grid9-4-dashboard.html', path: '3-rd pool/9/grid9-4-dashboard.html' },
          { name: 'grid9-5-gridflex.html', path: '3-rd pool/9/grid9-5-gridflex.html' },
        ]},
      ]},
      { name: '1–10 HTML', icon: '📁', children: [
        { name: '1.html', icon: '📄', path: '1.html' },
        { name: '2.html', icon: '📄', path: '2.html' },
        { name: '3.html', icon: '📄', path: '3.html' },
        { name: '4.html', icon: '📄', path: '4.html' },
        { name: '5.html', icon: '📄', path: '5.html' },
        { name: '6.html', icon: '📄', path: '6.html' },
        { name: '7.html', icon: '📄', path: '7.html' },
        { name: '8.html', icon: '📄', path: '8.html' },
        { name: '9.html', icon: '📄', path: '9.html' },
        { name: '10.html', icon: '📄', path: '10.html' },
      ]},
      { name: 'Карты и картинки', icon: '📁', children: [
        { name: 'Карта1.htm', icon: '🗺️', path: 'Карта1.htm' },
        { name: 'Карта2.htm', icon: '🗺️', path: 'Карта2.htm' },
        { name: 'Карта3.htm', icon: '🗺️', path: 'Карта3.htm' },
        { name: 'Картинка1.htm', icon: '🖼️', path: 'Картинка1.htm' },
        { name: 'Картинка2.htm', icon: '🖼️', path: 'Картинка2.htm' },
        { name: 'Картинка3.htm', icon: '🖼️', path: 'Картинка3.htm' },
      ]},
    ];

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ===== Просмотрщик работы (iframe вместо окна) =====
    const viewer = document.getElementById('viewer');
    const viewerFrame = document.getElementById('viewer-frame');

    function openFrame(path) {
      const url = encodeURI(path); // кодируем пробелы («4-th pool») и кириллицу
      viewerFrame.src = url;
      document.getElementById('viewer-path').textContent = path;
      document.getElementById('viewer-open').href = url;
      viewer.classList.add('is-open');
    }
    function closeViewer() {
      viewer.classList.remove('is-open');
      viewerFrame.src = 'about:blank'; // останавливаем работу
    }
    document.getElementById('viewer-back').onclick = closeViewer;
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && viewer.classList.contains('is-open')) closeViewer();
    });

    // ===== Проводник: навигация по дереву работ =====
    function initExplorer(root) {
      const main = root.querySelector('.fe-main');
      const crumb = root.querySelector('.fe-breadcrumb');
      const backBtn = root.querySelector('.fe-back');
      const upBtn = root.querySelector('.fe-up');

      let loc = [];      // путь индексов; [] = корень («Этот компьютер»)
      let history = [];  // история для кнопки «Назад»

      function nodeAt(path) {
        let node = { name: 'Этот компьютер', children: FS };
        for (const idx of path) node = node.children[idx];
        return node;
      }
      function childrenAt(path) {
        return path.length === 0 ? FS : (nodeAt(path).children || []);
      }

      function render() {
        const items = childrenAt(loc);

        // хлебные крошки
        let html = `<span class="fe-crumb" data-depth="0">💻 Этот компьютер</span>`;
        const acc = [];
        loc.forEach((idx, i) => {
          acc.push(idx);
          html += `<span>›</span><span class="fe-crumb" data-depth="${i + 1}">${escapeHtml(nodeAt(acc.slice()).name)}</span>`;
        });
        crumb.innerHTML = html;

        // элементы текущей папки
        main.innerHTML = items.map((node, idx) => {
          const icon = node.icon || (node.children ? '📁' : '🌐');
          return `<div class="fe-item" data-idx="${idx}"><span class="fe-item-icon">${icon}</span><div class="fe-item-name">${escapeHtml(node.name)}</div></div>`;
        }).join('') || `<div class="fe-empty">Папка пуста</div>`;

        main.querySelectorAll('.fe-item').forEach(el => {
          el.onclick = () => {
            const idx = Number(el.dataset.idx);
            const node = items[idx];
            if (node.children) { history.push(loc.slice()); loc.push(idx); render(); }
            else if (node.path) { openFrame(node.path); }
          };
        });
        crumb.querySelectorAll('.fe-crumb').forEach(el => {
          el.onclick = () => { history.push(loc.slice()); loc = loc.slice(0, Number(el.dataset.depth)); render(); };
        });

        upBtn.disabled = loc.length === 0;
        backBtn.disabled = history.length === 0;

        root.querySelectorAll('.fe-sidebar-item').forEach(it => {
          const nav = it.dataset.nav;
          const active = (nav === 'root' && loc.length === 0) || (loc.length >= 1 && String(loc[0]) === nav);
          it.classList.toggle('active', active);
        });
      }

      backBtn.onclick = () => { if (history.length) { loc = history.pop(); render(); } };
      upBtn.onclick = () => { if (loc.length) { history.push(loc.slice()); loc = loc.slice(0, -1); render(); } };

      root.querySelectorAll('.fe-sidebar-item').forEach(it => {
        it.onclick = () => {
          history.push(loc.slice());
          loc = it.dataset.nav === 'root' ? [] : [Number(it.dataset.nav)];
          render();
        };
      });

      render();
    }

    // ===== Запуск =====
    const explorerRoot = document.querySelector('.file-explorer');
    explorerRoot.querySelector('.fe-sidebar').innerHTML =
      `<div class="fe-sidebar-item" data-nav="root"><span class="fe-icon">💻</span><span class="fe-label">Этот компьютер</span></div>` +
      FS.map((node, i) => `<div class="fe-sidebar-item" data-nav="${i}"><span class="fe-icon">${node.icon || '📁'}</span><span class="fe-label">${node.name}</span></div>`).join('');

    initExplorer(explorerRoot);
  </script>
</body>
</html>
