<html>
<head>
  <title>Формы</title>
</head>
<body>

<h2>Формы</h2>
<h3>Элементы диалога</h3>

<form>

  <!-- Элементы INPUT -->
  <fieldset>
    <legend><a href="#"><font color="blue">Элементы INPUT</font></a></legend>

    <b>Текстовое поле</b><br>
    <input type="text" size="15"><br><br>

    <b>Поле для ввода пароля</b><br>
    <input type="password" size="15"><br><br>

    <b>Флажки</b><br>
    <input type="checkbox">
    <input type="checkbox" checked><br><br>

    <b>Переключатели</b><br>
    <input type="radio" name="r">
    <input type="radio" name="r">
    <input type="radio" name="r" checked><br><br>

    <b>Поле с именами файлов</b><br>
    <input type="file"><br><br>

    <b>Кнопка подтверждения ввода</b><br>
    <input type="submit" value="Подтверждение"><br><br>

    <b>Кнопка с изображением</b><br>
    <input type="image" src="Практика-1\pictures for HTML\knopka.gif"><br><br>

    <b>Кнопка очистки формы</b><br>
    <input type="reset" value="Очистка">

  </fieldset>

  <br>

  <!-- Элемент SELECT -->
  <fieldset>
    <legend><a href="#"><font color="blue">Элемент SELECT</font></a></legend>
    <select>
      <option selected>Первый</option>
      <option>Второй</option>
      <option>Третий</option>
    </select>
  </fieldset>

  <br>

  <!-- Элемент TEXTAREA -->
  <fieldset>
    <legend><a href="#"><font color="blue">Элемент TEXTAREA</font></a></legend>
    <textarea rows="5" cols="20">Область для ввода текста</textarea>
  </fieldset>

</form>

</body>
</html>
