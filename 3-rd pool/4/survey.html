<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Анкета</title>
</head>
<body>

    <header>
        <h1>Анкета пользователя</h1>
    </header>

    <main>
        <form action="#" method="post">

            <fieldset>
                <legend>Личные данные</legend>

                <p>
                    <label for="firstname">Имя:</label><br>
                    <input type="text" id="firstname" name="firstname" required>
                </p>

                <p>
                    <label for="lastname">Фамилия:</label><br>
                    <input type="text" id="lastname" name="lastname" required>
                </p>

                <p>
                    <label for="birthday">Дата рождения:</label><br>
                    <input type="date" id="birthday" name="birthday" required>
                </p>

                <p>
                    <label for="gender">Пол:</label><br>
                    <select id="gender" name="gender" required>
                        <option value="">Выберите...</option>
                        <option value="male">Мужской</option>
                        <option value="female">Женский</option>
                    </select>
                </p>

                <p>
                    <label for="city">Город:</label><br>
                    <input type="text" id="city" name="city" required>
                </p>
            </fieldset>

            <fieldset>
                <legend>Контакты</legend>

                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="phone">Телефон:</label><br>
                    <input type="tel" id="phone" name="phone" required>
                </p>

                <p>
                    <label for="telegram">Telegram:</label><br>
                    <input type="text" id="telegram" name="telegram" placeholder="@username">
                </p>

                <p>
                    <label for="website">Сайт или соцсеть:</label><br>
                    <input type="url" id="website" name="website" placeholder="https://...">
                </p>
            </fieldset>

            <fieldset>
                <legend>Предпочтения</legend>

                <p>
                    <label for="favcolor">Любимый цвет:</label><br>
                    <input type="color" id="favcolor" name="favcolor" value="#3366ff">
                </p>

                <p>
                    <label for="experience">Опыт работы (лет):</label><br>
                    <input type="number" id="experience" name="experience" min="0" max="50" value="0">
                </p>

                <p>
                    <label for="skill-level">Уровень владения компьютером:</label><br>
                    <input type="range" id="skill-level" name="skill-level" min="1" max="10" value="5">
                </p>

                <fieldset>
                    <legend>Чем интересуетесь</legend>
                    <p>
                        <input type="checkbox" id="int-web" name="interests" value="web">
                        <label for="int-web">Веб-разработка</label>
                    </p>
                    <p>
                        <input type="checkbox" id="int-mobile" name="interests" value="mobile">
                        <label for="int-mobile">Мобильная разработка</label>
                    </p>
                    <p>
                        <input type="checkbox" id="int-design" name="interests" value="design">
                        <label for="int-design">Дизайн</label>
                    </p>
                    <p>
                        <input type="checkbox" id="int-data" name="interests" value="data">
                        <label for="int-data">Анализ данных</label>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Предпочитаемый формат работы</legend>
                    <p>
                        <input type="radio" id="format-office" name="format" value="office" required>
                        <label for="format-office">В офисе</label>
                    </p>
                    <p>
                        <input type="radio" id="format-remote" name="format" value="remote">
                        <label for="format-remote">Удалённо</label>
                    </p>
                    <p>
                        <input type="radio" id="format-hybrid" name="format" value="hybrid">
                        <label for="format-hybrid">Гибрид</label>
                    </p>
                </fieldset>
            </fieldset>

            <fieldset>
                <legend>Дополнительная информация</legend>

                <p>
                    <label for="about">Расскажите о себе:</label><br>
                    <textarea id="about" name="about" rows="5" cols="40"></textarea>
                </p>

                <p>
                    <label for="resume">Загрузить резюме:</label><br>
                    <input type="file" id="resume" name="resume">
                </p>

                <p>
                    <label for="meeting">Удобная дата для встречи:</label><br>
                    <input type="datetime-local" id="meeting" name="meeting">
                </p>

                <p>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Хочу получать рассылку</label>
                </p>

                <p>
                    <input type="checkbox" id="agree" name="agree" required>
                    <label for="agree">Согласен на обработку персональных данных</label>
                </p>
            </fieldset>

            <p>
                <button type="submit">Отправить анкету</button>
                <button type="reset">Очистить</button>
            </p>

        </form>
    </main>

    <footer>
        <p>© 2026</p>
    </footer>

</body>
</html>
