<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обратная связь</title>
</head>
<body>

    <header>
        <h1>Обратная связь</h1>
    </header>

    <main>
        <form action="#" method="post" enctype="multipart/form-data">

            <p>
                <label for="name">Имя:</label><br>
                <input type="text" id="name" name="name" required>
            </p>

            <p>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="subject">Тема:</label><br>
                <input type="text" id="subject" name="subject" required>
            </p>

            <p>
                <label for="message">Сообщение:</label><br>
                <textarea id="message" name="message" rows="6" cols="40" required></textarea>
            </p>

            <fieldset>
                <legend>Приоритет обращения</legend>
                <p>
                    <input type="radio" id="priority-low" name="priority" value="low">
                    <label for="priority-low">Низкий</label>
                </p>
                <p>
                    <input type="radio" id="priority-mid" name="priority" value="mid" checked>
                    <label for="priority-mid">Средний</label>
                </p>
                <p>
                    <input type="radio" id="priority-high" name="priority" value="high">
                    <label for="priority-high">Высокий</label>
                </p>
            </fieldset>

            <p>
                <label for="file">Прикрепить файл:</label><br>
                <input type="file" id="file" name="file">
            </p>

            <p>
                <button type="submit">Отправить</button>
            </p>

        </form>
    </main>

    <footer>
        <p>© 2026</p>
    </footer>

</body>
</html>
