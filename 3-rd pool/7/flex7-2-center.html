<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Flex — Центрирование</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        /* ============================
           Родительский контейнер
           Занимает весь экран и центрирует содержимое
           ============================ */
        .page {
            width: 100%;
            height: 100vh;             /* вся высота экрана */

            display: flex;
            justify-content: center;   /* по горизонтали */
            align-items: center;       /* по вертикали */
        }

        /* Блок по центру */
        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 50px 60px;
            text-align: center;
            width: 380px;

            /* Внутри карточки тоже flex — 
               элементы идут колонкой с отступами */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .card h1 {
            font-size: 26px;
            color: #2c3e50;
        }

        .card p {
            color: #777;
            line-height: 1.5;
        }

        .card button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        .card button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>

    <div class="page">
        <div class="card">
            <h1>Добро пожаловать</h1>
            <p>Этот блок отцентрирован по горизонтали и вертикали с помощью flex.</p>
            <button>Начать</button>
        </div>
    </div>

</body>
</html>
